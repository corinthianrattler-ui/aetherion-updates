name: Export current rebuild inputs

on:
  push:
    paths:
      - '.github/workflows/export-current-rebuild-inputs.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack current rebuild inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          cp -a v2 export/
          cp -a changes export/ 2>/dev/null || true
          cp -a full-build export/ 2>/dev/null || true
          cp -a tools export/
          cp -a patches export/ 2>/dev/null || true
          cp channel.js export/ 2>/dev/null || true
          python3 - <<'PY'
          import json, pathlib
          manifest=pathlib.Path('export/v2/releases/1.74.9.json')
          data=json.loads(manifest.read_text())
          print('release',data['version'],'files',len(data['files']))
          PY
      - name: Upload rebuild inputs
        uses: actions/upload-artifact@v4
        with:
          name: aetherion-current-rebuild-inputs
          path: export
          compression-level: 0
          retention-days: 1
