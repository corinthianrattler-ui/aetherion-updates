name: Publish Aetherion v1.71 model assets

on:
  push:
    branches: [main]
    paths:
      - '.release-upload/v1.71.0/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cat .release-upload/v1.71.0/valkorion-base-lord.glb.part* > release/valkorion-base-lord.glb
          cat .release-upload/v1.71.0/valkorion-armored.glb.part* > release/valkorion-armored.glb
          cat .release-upload/v1.71.0/libita-gothic-gown.glb.part* > release/libita-gothic-gown.glb
          echo '963d66d60d4e7b1dcfdeb43f44bc764683ddf2f8a4a4ffe4dbd63a530d186d47  release/valkorion-base-lord.glb' | sha256sum -c -
          echo 'de12485beeebd6be86e9354e25a2071a1203fb94a6b8b660fd8c7d01acaecba1  release/valkorion-armored.glb' | sha256sum -c -
          echo '5941aa40b5c08b2e71b04a39665a11129d5960312361d513fa3f76d34b0df2f9  release/libita-gothic-gown.glb' | sha256sum -c -
      - name: Publish v1.71.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Aetherion Reforged v1.71.0 (Android build 188)

          - Valkorion fitted base body and Lord's royal equipment model
          - Valkorion complete armored model
          - Libita Savitas fitted gothic ball gown model
          - Permanent in-game Game Updates button with visible download progress
          NOTES
          if gh release view v1.71.0 >/dev/null 2>&1; then
            gh release upload v1.71.0 release/*.glb --clobber
            gh release edit v1.71.0 --title 'Aetherion Reforged v1.71.0' --notes-file release-notes.md
          else
            gh release create v1.71.0 release/*.glb --target "$GITHUB_SHA" --title 'Aetherion Reforged v1.71.0' --notes-file release-notes.md
          fi
