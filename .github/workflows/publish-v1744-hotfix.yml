name: Publish Aetherion v1.74.4 HUD and quartermaster hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1744-hotfix.yml'
      - 'changes/1.74.4/**'
      - 'channel.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate live compatibility hotfix
        shell: bash
        run: |
          set -euo pipefail
          node --check changes/1.74.4/aetherion-v1744-hotfix.js
          node --check channel.js
          test -s custom/npc-portraits/v168/00_quartermaster_original_unchanged.webp
          echo 'f2df55f5ab385a161aaccc22b039863f975fee6e549a196af60e46ddf6e865cf  changes/1.74.4/aetherion-v1744-hotfix.js' | sha256sum --check --strict
          grep -F "position:absolute!important" changes/1.74.4/aetherion-v1744-hotfix.js >/dev/null
          grep -F "aetherion-android-safearea" changes/1.74.4/aetherion-v1744-hotfix.js >/dev/null
          grep -F "00_quartermaster_original_unchanged.webp" changes/1.74.4/aetherion-v1744-hotfix.js >/dev/null
          grep -F "e103ec3098be9f6dd90657a9e085370e319c11f5/changes/1.74.4/aetherion-v1744-hotfix.js" channel.js >/dev/null
          grep -F "f2df55f5ab385a161aaccc22b039863f975fee6e549a196af60e46ddf6e865cf" channel.js >/dev/null
          curl -fsSL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/corinthianrattler-ui/aetherion-updates/e103ec3098be9f6dd90657a9e085370e319c11f5/changes/1.74.4/aetherion-v1744-hotfix.js' \
            -o /tmp/live-v1744-hotfix.js
          echo 'f2df55f5ab385a161aaccc22b039863f975fee6e549a196af60e46ddf6e865cf  /tmp/live-v1744-hotfix.js' | sha256sum --check --strict
          node --check /tmp/live-v1744-hotfix.js
          curl -fsSL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/corinthianrattler-ui/aetherion-updates/main/channel.js' \
            -o /tmp/live-channel.js
          node --check /tmp/live-channel.js
          cmp -s channel.js /tmp/live-channel.js
          curl -fsSL --retry 3 --retry-delay 1 \
            'https://cdn.jsdelivr.net/gh/corinthianrattler-ui/aetherion-updates@829c283d4e1140c51ebb21ffc8bc6bd64a51f808/custom/npc-portraits/v168/00_quartermaster_original_unchanged.webp' \
            -o /tmp/edwyn.webp
          test "$(stat -c%s /tmp/edwyn.webp)" -gt 1000
          echo 'Compatibility hotfix source, channel bootstrap, and Edwyn portrait are live and verified.'

      - name: Confirm current v1.74.3 APK reaches compatibility channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk='Aetherion_Reforged_v1.74.3_FULL_GAME_REPAIR.apk'
          gh release download v1.74.3 --pattern "$apk"
          echo 'd055b620e9f434fbba8ce0505d293be3141f072b81543a34340db0ca4996e00f  Aetherion_Reforged_v1.74.3_FULL_GAME_REPAIR.apk' | sha256sum --check --strict
          python3 - <<'PY'
          import re, zipfile
          apk='Aetherion_Reforged_v1.74.3_FULL_GAME_REPAIR.apk'
          with zipfile.ZipFile(apk) as z:
              index=z.read('assets/game/index.html').decode('utf-8','replace')
              refs=re.findall(r'<script[^>]+src=["\']([^"\']+)', index, flags=re.I)
              reachable=[]
              for ref in refs:
                  clean=ref.split('?',1)[0].lstrip('./')
                  path='assets/game/'+clean
                  if path not in z.namelist():
                      continue
                  try: text=z.read(path).decode('utf-8','replace')
                  except Exception: continue
                  if 'channel.js' in text and 'scheduleAutomaticCheck' in text and 'checkForUpdates' in text:
                      reachable.append(path)
              print('compatibility-channel bootstrap scripts:', reachable)
              assert reachable, 'The installed v1.74.3 index does not execute a legacy updater that checks channel.js.'
          PY

      - name: Install signing dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet cryptography

      - name: Build signed cumulative v1.74.4 update when signer is available
        id: signed
        shell: bash
        env:
          AETHERION_UPDATE_PRIVATE_KEY: ${{ secrets.AETHERION_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keydir=/tmp/aetherion-update-signing
          install -m 700 -d "$keydir"
          if [ -z "${AETHERION_UPDATE_PRIVATE_KEY:-}" ]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'The repository has no AETHERION_UPDATE_PRIVATE_KEY secret; signed v2 packaging is skipped. The verified legacy compatibility channel remains active.'
            exit 0
          fi
          printf '%s' "$AETHERION_UPDATE_PRIVATE_KEY" > "$keydir/private.pem"
          chmod 600 "$keydir/private.pem"
          python3 tools/build_v2_update.py 1.74.4 \
            --private-key "$keydir/private.pem" \
            --extension v1744-hud-quartermaster-hotfix=changes/1.74.4/aetherion-v1744-hotfix.js \
            --asset custom/npc-portraits/v168/00_quartermaster_original_unchanged.webp=custom/npc-portraits/v168/00_quartermaster_original_unchanged.webp \
            --notes "Fixes the Android top HUD and House Dominus dial placement and restores Quartermaster Edwyn Rook's unique original portrait. No APK replacement or save reset is required."
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Verify generated signed channel
        if: steps.signed.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import padding, rsa

          root = Path('.')
          channel = json.loads((root/'v2/channel.json').read_text('utf-8'))
          assert channel['latest'] == '1.74.4'
          release = next(r for r in channel['releases'] if r['version'] == '1.74.4')
          manifest_bytes = (root/'v2/releases/1.74.4.json').read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == release['manifestSha256']
          manifest = json.loads(manifest_bytes)
          by_id = {f['id']: f for f in manifest['files']}
          assert 'dominus-blood-dial' in by_id
          assert 'v1744-hud-quartermaster-hotfix' in by_id
          assert any(f.get('path') == 'custom/ui/dominus-time/dominus-blood-dial-base.webp' for f in manifest['files'])
          assert any(f.get('path') == 'custom/npc-portraits/v168/00_quartermaster_original_unchanged.webp' for f in manifest['files'])
          assert manifest.get('deletePaths') == []

          pub = json.loads((root/'v2/update-public.json').read_text('utf-8'))
          key = rsa.RSAPublicNumbers(int(pub['e']), int(pub['n'], 16)).public_key()
          canonical = json.dumps({
              'appId':'aetherion-reforged',
              'version':'1.74.4',
              'manifestUrl':release['manifestUrl'],
              'manifestSha256':release['manifestSha256'],
          }, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          key.verify(base64.b64decode(release['signature']), canonical, padding.PKCS1v15(), hashes.SHA256())
          print('v1.74.4 cumulative manifest and RSA signature verified')
          PY

      - name: Publish signed update channel
        if: steps.signed.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aetherion Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/channel.json v2/releases/1.74.4.json v2/files/1.74.4/
          git diff --cached --check
          git commit -m 'Publish v1.74.4 HUD and quartermaster hotfix'
          git push origin HEAD:main

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -rf /tmp/aetherion-update-signing
